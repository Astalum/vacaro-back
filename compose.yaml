services:
  api:
    build:
      context: .
      target: development
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-vacaro}:${POSTGRES_PASSWORD:-vacaro}@db:5432/${POSTGRES_DB:-vacaro}?sslmode=disable
      SESSION_KEY: ${SESSION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      GUEST_TTL: ${GUEST_TTL:-168h}
      REGISTERED_SESSION_TTL: ${REGISTERED_SESSION_TTL:-720h}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_LOGIN_REDIRECT_URL: ${GOOGLE_LOGIN_REDIRECT_URL:-}
      GOOGLE_CALENDAR_REDIRECT_URL: ${GOOGLE_CALENDAR_REDIRECT_URL:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-vacaro}:${POSTGRES_PASSWORD:-vacaro}@db:5432/${POSTGRES_DB:-vacaro}?sslmode=disable
      - up
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacaro}
      POSTGRES_USER: ${POSTGRES_USER:-vacaro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacaro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
